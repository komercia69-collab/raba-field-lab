<svg viewBox="0 0 1100 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="d1arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#aab4c0"/>
    </marker>
  </defs>

  <!-- transparent background: intended for placement on a warm light page -->

  <!-- boxes -->
  <g stroke="#aab4c0" stroke-width="1.2" fill="none">
    <rect x="60"  y="70" width="200" height="70" rx="9"/>
    <rect x="320" y="70" width="200" height="70" rx="9"/>
    <rect x="580" y="70" width="200" height="70" rx="9"/>
    <rect x="840" y="70" width="200" height="70" rx="9"/>
  </g>

  <g font-size="15" font-weight="400" fill="#3d3830" text-anchor="middle">
    <text x="160" y="110">Source material</text>
    <text x="420" y="110">AI transformation</text>
    <text x="680" y="110">Usable output</text>
    <text x="940" y="101">Human decision</text>
    <text x="940" y="120">/ action</text>
  </g>

  <!-- connecting arrows -->
  <g stroke="#aab4c0" stroke-width="1.2" marker-end="url(#d1arr)">
    <line x1="262" y1="105" x2="318" y2="105"/>
    <line x1="522" y1="105" x2="578" y2="105"/>
    <line x1="782" y1="105" x2="838" y2="105"/>
  </g>

  <!-- value callout, tied to Usable output -->
  <line x1="680" y1="140" x2="680" y2="182" stroke="#8f9daf" stroke-width="1" stroke-dasharray="2,3"/>
  <text x="680" y="204" text-anchor="middle" font-size="13.5" fill="#5b7290">value: volume reduced, structure improved</text>

  <!-- risk callout, tied to the transition into human decision -->
  <line x1="810" y1="105" x2="810" y2="240" stroke="#c88a55" stroke-width="1" stroke-dasharray="2,3"/>
  <text x="810" y="260" text-anchor="middle" font-size="13.5" fill="#a85a26">risk: potentially significant meaning</text>
  <text x="810" y="278" text-anchor="middle" font-size="13.5" fill="#a85a26">may be silently lost</text>
</svg>
