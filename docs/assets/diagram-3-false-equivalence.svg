<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <!-- transparent background: intended for placement on a warm light page -->

  <g font-size="18" font-weight="400">
    <text x="150" y="70"  text-anchor="end" fill="#5b7290">shorter</text>
    <text x="350" y="70"  text-anchor="middle" fill="#a85a26" font-weight="600">≠</text>
    <text x="380" y="70"  text-anchor="start" fill="#3d3830">sufficient</text>

    <text x="150" y="140" text-anchor="end" fill="#5b7290">cleaner</text>
    <text x="350" y="140" text-anchor="middle" fill="#a85a26" font-weight="600">≠</text>
    <text x="380" y="140" text-anchor="start" fill="#3d3830">complete</text>

    <text x="150" y="210" text-anchor="end" fill="#5b7290">confident</text>
    <text x="350" y="210" text-anchor="middle" fill="#a85a26" font-weight="600">≠</text>
    <text x="380" y="210" text-anchor="start" fill="#3d3830">safe</text>

    <text x="150" y="280" text-anchor="end" fill="#5b7290">structured</text>
    <text x="350" y="280" text-anchor="middle" fill="#a85a26" font-weight="600">≠</text>
    <text x="380" y="280" text-anchor="start" fill="#3d3830">faithful</text>
  </g>

  <!-- thin separators -->
  <g stroke="#e4dcd0" stroke-width="1">
    <line x1="90" y1="98"  x2="610" y2="98"/>
    <line x1="90" y1="168" x2="610" y2="168"/>
    <line x1="90" y1="238" x2="610" y2="238"/>
  </g>
</svg>
