<svg viewBox="0 0 1100 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="d2arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#aab4c0"/>
    </marker>
    <marker id="d2arr-return" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8f9daf"/>
    </marker>
  </defs>

  <!-- transparent background: intended for placement on a warm light page -->

  <!-- boxes -->
  <g stroke="#aab4c0" stroke-width="1.2" fill="none">
    <rect x="100" y="70" width="220" height="70" rx="9"/>
    <rect x="440" y="70" width="220" height="70" rx="9"/>
    <rect x="780" y="70" width="220" height="70" rx="9"/>
  </g>

  <g font-size="15" font-weight="400" fill="#3d3830" text-anchor="middle">
    <text x="210" y="110">Human intent</text>
    <text x="550" y="110">AI transformation</text>
    <text x="890" y="110">Output</text>
  </g>

  <!-- forward arrows -->
  <g stroke="#aab4c0" stroke-width="1.2" marker-end="url(#d2arr)">
    <line x1="322" y1="105" x2="438" y2="105"/>
    <line x1="662" y1="105" x2="778" y2="105"/>
  </g>

  <!-- return arrow: reconstruction question -->
  <path d="M 890 142 C 890 236, 210 236, 210 142"
        fill="none" stroke="#8f9daf" stroke-width="1.2" stroke-dasharray="4,3"
        marker-end="url(#d2arr-return)"/>

  <text x="550" y="278" text-anchor="middle" font-size="14.5" fill="#5b7290">Can the original intent and preserved meaning</text>
  <text x="550" y="300" text-anchor="middle" font-size="14.5" fill="#5b7290">be reconstructed?</text>
</svg>
